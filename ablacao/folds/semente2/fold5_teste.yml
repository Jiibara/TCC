version: "3.1"
nlu:
- intent: confirmarLembrete
  examples: |
    - vou sim
    - vou estar presente
    - pode marcar que eu vou
    - vou comparecer na consulta
    - sim, confirmo
- intent: atualizar_cadastro
  examples: |
    - meu número mudou
    - atualizar meus dados
    - quero alterar meu telefone
    - atualizar informações pessoais
    - quero mudar meu convênio no cadastro
- intent: revogar_consentimento
