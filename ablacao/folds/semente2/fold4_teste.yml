    - quero agendar uma consulta pela [Unimed](convenio)
    - quero marcar um horário pra [sexta](data) de manhã
    - tem vaga pra [dia 15](data)?
    - agendar
- intent: cancelarConsulta
  examples: |
    - preciso desmarcar a consulta de [amanhã](data)
