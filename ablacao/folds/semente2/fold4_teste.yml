version: "3.1"
nlu:
- intent: confirmarLembrete
  examples: |
    - confirmado
    - sim, vou comparecer
    - pode deixar, estarei aí
    - confirmo, obrigado pelo lembrete
    - tudo certo, confirmo minha ida
- intent: atualizar_cadastro
  examples: |
    - quero atualizar meu cadastro
    - trocar meus dados
    - preciso corrigir minha data de nascimento
    - troquei de plano de saúde
    - o meu nome está escrito errado
- intent: revogar_consentimento
  examples: |
    - quero parar de receber lembretes
    - cancelar meu consentimento
    - retirar consentimento LGPD
    - não quero mais que usem meus dados
    - quero deixar de receber mensagens de lembrete
- intent: politica_privacidade
  examples: |
    - quais dados vocês coletam
    - como meus dados são tratados
    - sobre privacidade
    - quais são meus direitos sobre os dados
    - quero entender como usam meus dados
- intent: agendarConsulta
