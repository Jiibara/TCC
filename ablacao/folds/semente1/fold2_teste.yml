version: "3.1"
nlu:
- intent: confirmarLembrete
  examples: |
    - confirmo o horário
    - com certeza vou
    - recebi o lembrete e confirmo
    - sim, confirmo
    - confirmo a minha consulta
- intent: atualizar_cadastro
  examples: |
    - mudei de convênio
    - preciso corrigir minha data de nascimento
    - atualizar informações pessoais
    - preciso trocar meu número de telefone
    - atualizar telefone
- intent: revogar_consentimento
  examples: |
    - não autorizo mais o uso dos meus dados
    - quero parar de receber lembretes
    - revogo a autorização
    - pare de me enviar lembretes
    - desisto do consentimento
- intent: politica_privacidade
  examples: |
    - como meus dados são protegidos
    - vocês compartilham meus dados
    - me explique a política de dados
    - quais dados a clínica armazena
    - informações sobre a lei de proteção de dados
- intent: agendarConsulta
  examples: |
    - quero marcar uma consulta para [sexta-feira](data)
    - gostaria de marcar consulta de [pediatria](especialidade) para [semana que vem](data)
    - poderia me agendar com o [Dr. Bruno](especialidade)?
    - tem algum horário livre para [pediatra](especialidade) [amanhã de manhã](data)?
    - quero marcar uma consulta as [10h30](horario)
    - oi, consigo marcar um horário pra [pediatra](especialidade)?
    - quero consultar com [Dr. Bruno Alves](especialidade)
    - to querendo marcar uma consulta pro meu filho, [pediatria](especialidade)
    - quero agendar com [convênio Unimed](convenio) pra [cardiologia](especialidade)
    - tem vaga pra [dia 15](data)?
    - quero uma consulta com [pediatra](especialidade) pra [amanhã](data)
    - agendar
- intent: cancelarConsulta
  examples: |
    - preciso desmarcar a consulta de [amanhã](data)
    - cancela minha consulta com o [cardiologista](especialidade)
    - preciso cancelar meu atendimento com [endocrinologista](especialidade)
    - cancela meu horário de [amanha](data) por gentileza
    - por favor, cancele meu agendamento com o [Dr. Bruno](especialidade)
    - fica sem efeito minha consulta, cancela por favor
    - cancela a consulta, obrigado
    - dá baixa no meu horário, por favor
    - retira meu agendamento
    - não vou mais poder ir, desmarca
    - não quero mais a consulta
    - cancelar
- intent: reagendarConsulta
  examples: |
    - quero remarcar minha consulta de [cardiologista](especialidade) para outro dia
    - dá pra remarcar meu horário das [09h30](horario)?
    - quero remarcar meu horário com convênio [Unimed](convenio)
    - não vou poder no horário marcado, dá pra mudar?
    - gostaria de mudar minha consulta de [cardiologia](especialidade) pra [sábado](data)
    - vamos reagendar pra uma data mais pra frente?
    - preciso de um novo horário pra minha consulta
    - minha consulta precisa mudar de dia, consegue ajudar?
    - consigo trocar o horário da minha consulta?
    - quero trocar meu horário por outro
- intent: informarConvenio
  examples: |
    - meu plano é [Unimed](convenio), vocês atendem?
