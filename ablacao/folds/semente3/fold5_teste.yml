version: "3.1"
nlu:
- intent: confirmarLembrete
  examples: |
    - estarei lá
    - vou estar presente
    - com certeza vou
    - estarei presente no horário marcado
    - confirmo, obrigado pelo lembrete
- intent: atualizar_cadastro
  examples: |
    - trocar meus dados
    - alterar meus dados cadastrais
    - mudei de convênio
    - atualizar informações pessoais
    - quero mudar meu convênio no cadastro
- intent: revogar_consentimento
  examples: |
    - revogar consentimento
    - retirar minha autorização
    - cancelar meu consentimento
    - cancelar a autorização de lembretes
    - pare de me enviar lembretes
- intent: politica_privacidade
  examples: |
    - quero saber sobre a LGPD
    - quais dados vocês coletam
    - quem tem acesso aos meus dados
    - termos de uso dos dados
    - quais dados a clínica armazena
