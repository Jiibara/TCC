version: "3.1"
nlu:
- intent: confirmarLembrete
  examples: |
    - confirmado
    - confirmo a consulta de amanhã
    - tá confirmado
    - vou comparecer na consulta
    - confirmo a minha consulta
- intent: atualizar_cadastro
  examples: |
    - editar cadastro
    - meus dados estão errados
    - o meu nome está escrito errado
    - quero revisar meus dados
    - atualizar telefone
- intent: revogar_consentimento
  examples: |
    - não quero mais receber lembretes
    - quero retirar meu consentimento
    - não quero mais que usem meus dados
    - revogar autorização
    - retirar a permissão dos meus dados
- intent: politica_privacidade
  examples: |
    - o que fazem com minhas informações
    - privacidade
    - dados pessoais
    - sobre privacidade
    - o que vocês fazem com meus dados pessoais
- intent: agendarConsulta
  examples: |
    - você pode agendar uma consulta com a [Dra. Ana](especialidade)?
    - gostaria de marcar consulta de [pediatria](especialidade) para [semana que vem](data)
    - vcs tem horario pra [amanha](data)?
    - queria agendar uma consulta com o convênio [Unimed](convenio)
