    - quero ver disponibilidade de [endocrinologia](especialidade)
    - me ajuda a marcar uma consulta?
    - gostaria de marcar consulta, qualquer especialidade que tiver vaga
    - me arruma um horário de [clínica geral](especialidade) por favor
    - marca pra mim com [clínico geral](especialidade)
- intent: cancelarConsulta
  examples: |
    - quero cancelar a consulta com [Dra. Ana](especialidade)
    - vou ter que cancelar, não consigo ir
    - não vou conseguir ir, cancela por favor
    - preciso remover minha consulta da agenda
    - oi, queria cancelar minha consulta
    - cancela a consulta, obrigado
    - quero remover meu agendamento
    - quero excluir minha consulta
    - apaga minha consulta marcada
    - não vou mais poder ir, desmarca
    - cancela meu horário
    - quero cancelar o agendamento
- intent: reagendarConsulta
  examples: |
    - pode mudar minha consulta para as [15h](horario)?
