    - qual a rua da clínica?
    - qual CEP da clínica?
- intent: consultar_preco_particular
  examples: |
    - quanto custa uma consulta particular?
    - qual a forma de pagamento da consulta particular?
    - quanto custa uma consulta?
    - qual o valor de uma consulta de cardiologia?
    - quanto é a consulta com o clínico geral?
    - quanto fica a consulta de pediatria?
- intent: falar_com_atendente
  examples: |
    - quero falar com um atendente
    - isso aqui tem atendimento humano?
    - quero falar com a recepção
    - isso não está resolvendo, quero um atendente
    - quero reclamar com um atendente de verdade
- intent: consultarAgendamento
  examples: |
    - qual data eu agendei?
    - com quem é minha consulta?
    - que dia é meu agendamento?
    - consultar meu agendamento
    - qual a data e hora da minha consulta?
    - tem alguma consulta no meu nome?
    - lembra pra mim quando é minha consulta
- intent: emergencia
  examples: |
    - estou passando mal
    - acho que estou tendo um infarto
    - preciso de atendimento de urgência agora
    - acho que estou tendo um AVC
    - ele desmaiou
    - ela está convulsionando
